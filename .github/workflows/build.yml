name: Build platform artifacts
on:
  push:
    branches: [main, test]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spigot:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.targets.outputs.spigot) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: python3 scripts/test-versions.py
      - name: Compile against exact Spigot API
        run: mvn -B -ntp verify -Dspigot.version=${{ matrix.api }}-R0.1-SNAPSHOT -DskipTests=${{ matrix.api != '1.8' }}
      - uses: actions/upload-artifact@v4
        if: matrix.api == '1.8'
        with:
          name: tranforcpp-spigot
          path: target/tranforcpp-spigot-*.jar
          if-no-files-found: error
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      spigot: ${{ steps.matrix.outputs.spigot }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python3 -c 'import json,os; d=json.load(open("compatibility/versions.json")); print("value="+json.dumps(d,separators=(",",":")),file=open(os.environ["GITHUB_OUTPUT"],"a"))'
          python3 -c 'import json,os; d=json.load(open("compatibility/spigot-versions.json")); print("spigot="+json.dumps(d,separators=(",",":")),file=open(os.environ["GITHUB_OUTPUT"],"a"))'
  mods:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Select Gradle JVM
        run: |
          if [ '${{ matrix.gradle }}' = '9.6.0' ]; then
            echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          else
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: python3 scripts/configure-build.py '${{ matrix.loader }}' '${{ matrix.minecraft }}'
      - name: Build remapped or unobfuscated mod for the exact game target
        run: gradle -p adapters/${{ matrix.loader }} --no-daemon build -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"
      - uses: actions/upload-artifact@v4
        with:
          name: tranforcpp-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            adapters/${{ matrix.loader }}/build/libs/*.jar
            !adapters/${{ matrix.loader }}/build/libs/*-sources.jar
            !adapters/${{ matrix.loader }}/build/libs/*-dev.jar
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [spigot, mods]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.jar
          fail_on_unmatched_files: true
