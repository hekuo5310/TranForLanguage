name: Build platform artifacts
on:
  push:
    branches: [main, test]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  spigot:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.targets.outputs.spigot) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: python3 scripts/test-versions.py
      - name: Verify language toolchains for integration tests
        if: matrix.api == '1.8'
        run: |
          gcc --version
          g++ --version
          python3 --version
          rustc --version
          cargo --version
      - name: Compile against exact Spigot API
        run: mvn -B -ntp verify -Dspigot.version=${{ matrix.api }}-R0.1-SNAPSHOT -DskipTests=${{ matrix.api != '1.8' }}
      - name: Verify plugin metadata and Java 8 artifact
        run: python3 scripts/check-artifact.py spigot '${{ matrix.api }}' 8 'target/tranforlanguage-spigot-*.jar'
      - uses: actions/upload-artifact@v4
        if: matrix.api == '1.8'
        with:
          name: tranforlanguage-spigot
          path: target/tranforlanguage-spigot-*.jar
          if-no-files-found: error
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      spigot: ${{ steps.matrix.outputs.spigot }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python3 -c 'import json,os; d=json.load(open("compatibility/versions.json")); print("value="+json.dumps(d,separators=(",",":")),file=open(os.environ["GITHUB_OUTPUT"],"a"))'
          python3 -c 'import json,os; d=json.load(open("compatibility/spigot-versions.json")); print("spigot="+json.dumps(d,separators=(",",":")),file=open(os.environ["GITHUB_OUTPUT"],"a"))'
  mods:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Select Gradle JVM
        run: |
          if [[ '${{ matrix.gradle }}' == 9.* ]]; then
            echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          else
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: python3 scripts/configure-build.py '${{ matrix.loader }}' '${{ matrix.minecraft }}'
      - name: Build remapped or unobfuscated mod for the exact game target
        run: gradle -p adapters/${{ matrix.loader }} --no-daemon build -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"
      - name: Verify mod descriptor, entrypoint and remapped artifact
        run: python3 scripts/check-artifact.py '${{ matrix.loader }}' '${{ matrix.minecraft }}' '${{ matrix.java }}' 'adapters/${{ matrix.loader }}/build/libs/*.jar'
      - uses: actions/upload-artifact@v4
        with:
          name: tranforlanguage-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            adapters/${{ matrix.loader }}/build/libs/*.jar
            !adapters/${{ matrix.loader }}/build/libs/*-sources.jar
            !adapters/${{ matrix.loader }}/build/libs/*-dev.jar
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v2.0.0]'))
    needs: [spigot, mods]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the verified release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version"))')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            [[ "$tag" == "v$version" ]] || { echo "Tag does not match project version" >&2; exit 1; }
          else
            # One-time publication explicitly requested for this release merge.
            [[ "$version" == "2.0.0" ]] || { echo "Unexpected release version" >&2; exit 1; }
            tag="v2.0.0"
            existing="$(git ls-remote --tags origin "refs/tags/$tag")"
            if [[ -n "$existing" && "${existing%%[[:space:]]*}" != "$GITHUB_SHA" ]]; then
              echo "Refusing to move an existing release tag" >&2; exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/**/*.jar
          fail_on_unmatched_files: true
