name: TranForLanguage
version: '${project.version}'
api-version: '1.13'
main: com.github.tranforlanguage.TranForLanguage
author: 'hekuo,Xiao-QDev'
description: '在 Minecraft 服务端运行 C、C++、Python、Rust、JavaScript、Go、Ruby、PHP 和 Java 程序，并支持程序间互相调用'
permissions:
  tranforlanguage.use:
    description: Allow using TranForLanguage commands
    default: op
  tranforlanguage.reload:
    description: Allow starting, stopping and reloading programs
    default: op
  tranforlanguage.version:
    description: Allow checking the project version
    default: op

commands:
  tranforlanguage:
    description: Manage TranForLanguage programs
    usage: /<command> <list|version|reload [id]|start id|stop id>
    permission: tranforlanguage.use
