plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
apply from: '../../scripts/generate-adapter.gradle'
repositories { mavenCentral() }
minecraft { mappings channel: 'official', version: minecraft_version }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${loader_version}" }
processResources { from('src/main/templates/mods.toml') { into 'META-INF' } }
// Forge switched to official runtime names in 1.20.6. Older targets still require SRG reobfuscation.
if (minecraft_version == '1.20' || minecraft_version.matches('1\\.20\\.[1-4]')) jar.finalizedBy 'reobfJar'
